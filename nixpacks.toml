[phases.setup]
# System packages required by Python dependencies.
# zbar: required by pyzbar for barcode/ISBN image extraction.
# postgresql: provides pg_dump / pg_restore for django-dbbackup.
#
# Both aptPkgs (Debian/Ubuntu) and pkgs (Nix) are listed because Railway's
# Nixpacks provider can use either backend depending on the build environment.
aptPkgs = ["libzbar0", "postgresql-client-18"]
pkgs = ["zbar", "postgresql_18"]

[variables]
# Pin Python version to match runtime.txt / local dev environment.
NIXPACKS_PYTHON_VERSION = "3.12"
